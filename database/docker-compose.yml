name: studentjob-demo
services:
  mysql:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: demo-root-only
      MYSQL_DATABASE: studentjob_marketplace
      MYSQL_USER: studentjob_demo
      MYSQL_PASSWORD: demo-only
      TZ: UTC
    ports:
      - "127.0.0.1:${STUDENTJOB_DB_PORT:-3307}:3306"
    volumes:
      - demo-data:/var/lib/mysql
      - ./migrations/001_users_profiles.sql:/docker-entrypoint-initdb.d/001_users_profiles.sql:ro
      - ./migrations/002_jobs_applications.sql:/docker-entrypoint-initdb.d/002_jobs_applications.sql:ro
      - ./migrations/003_email_verifications.sql:/docker-entrypoint-initdb.d/003_email_verifications.sql:ro
      - ./migrations/004_cvs.sql:/docker-entrypoint-initdb.d/004_cvs.sql:ro
      - ./migrations/005_chat.sql:/docker-entrypoint-initdb.d/005_chat.sql:ro
      - ./migrations/006_ai.sql:/docker-entrypoint-initdb.d/006_ai.sql:ro
      - ./migrations/007_reviews_profile_cv.sql:/docker-entrypoint-initdb.d/007_reviews_profile_cv.sql:ro
      - ./seeds/001_demo.sql:/docker-entrypoint-initdb.d/900_demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -Nse 'SELECT COUNT(*) FROM reviews' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 30s
volumes:
  demo-data:
